<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniMiniMi</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #222; background: #fff; }

    header {
      position: relative;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px 105px;
      overflow: hidden;
      background:
        linear-gradient(to bottom, rgba(255,255,255,.42) 0%, rgba(255,255,255,.50) 68%, #fff 100%),
        url("assets/images/miniminimi-hero-bg-optimized-final.jpg") center center / cover no-repeat;
    }

    .hero-content { position: relative; z-index: 1; width: 100%; }
    .logo { width: min(620px, 85%); height: auto; filter: drop-shadow(0 4px 8px rgba(255,255,255,.55)); }
    .slogan { margin-top: 20px; font-size: 24px; font-weight: 600; text-shadow: 0 2px 8px rgba(255,255,255,.85); }

    main { max-width: 1000px; margin: 0 auto; padding: 20px 30px 100px; }
    h2 { font-size: 28px; margin-bottom: 25px; }
    .game-link { display: block; color: inherit; text-decoration: none; }
    .game-card {
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      padding: 32px;
      min-height: 180px;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .game-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    .game-card h3 { margin: 0 0 12px; font-size: 24px; }
    .game-card p { margin: 0; color: #666; line-height: 1.7; }

    footer { border-top: 1px solid #eee; padding: 30px 20px; text-align: center; color: #777; font-size: 14px; }
    footer a { color: #555; text-decoration: none; margin: 0 10px; }

    @media (max-width: 600px) {
      header { min-height: 410px; padding: 60px 20px 85px; background-position: center center; }
      .logo { width: min(520px, 92%); }
      .slogan { font-size: 20px; }
      main { padding: 10px 20px 80px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="hero-content">
      <img class="logo" src="miniminimi-logo.png" alt="MiniMiniMi">
      <div class="slogan">Fun comes first</div>
    </div>
  </header>

  <main>
    <h2>Games</h2>
    <a class="game-link" href="games/late-for-work/index.html">
      <div class="game-card">
        <h3>지각하면 짤림</h3>
        <p>Coming Soon</p>
      </div>
    </a>
  </main>

  <footer>
    <a href="privacy/index.html">Privacy Policy</a>
    <a href="support/index.html">Support</a>
    <a href="patch-notes/index.html">Patch Notes</a>
    <p>© 2026 MiniMiniMi</p>
  </footer>
</body>
</html>
